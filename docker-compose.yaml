# Local orchestration for the whole stack: one PostgreSQL per service, one shared
# Kafka broker, and the two services. A starting point — tune for your needs.
#
#   docker compose up --build
#
# Endpoints once up:  orders -> http://localhost:8081/hello   payments -> http://localhost:8082/hello

services:
  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5432:5432"
    volumes:
      - orders-db:/var/lib/postgresql/data

  postgres-payments:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5433:5432"
    volumes:
      - payments-db:/var/lib/postgresql/data

  kafka:
    image: apache/kafka-native:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    depends_on:
      - postgres-orders
      - kafka
    environment:
      ORDERS_DB_URL: jdbc:postgresql://postgres-orders:5432/orders
      ORDERS_DB_USER: orders
      ORDERS_DB_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"

  payments-service:
    build:
      context: .
      dockerfile: payments-service/Dockerfile
    depends_on:
      - postgres-payments
      - kafka
    environment:
      PAYMENTS_DB_URL: jdbc:postgresql://postgres-payments:5432/payments
      PAYMENTS_DB_USER: payments
      PAYMENTS_DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"

volumes:
  orders-db:
  payments-db:
