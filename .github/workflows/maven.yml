# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and verify with Maven
        run: mvn -B verify --file pom.xml

  build-docker-images:
    runs-on: ubuntu-latest
    needs: verify

    strategy:
      matrix:
        service:
          - name: payments-service
            context: .
          - name: orders-service
            context: .
          - name: gateway
            context: ./gateway

    steps:
      - uses: actions/checkout@v6

      - name: Login to Cloud.ru Container Registry
        uses: docker/login-action@v4
        with:
          registry: public.cr.cloud.ru
          username: ${{ secrets.CLOUD_RU_REGISTRY_LOGIN }}
          password: ${{ secrets.CLOUD_RU_REGISTRY_PASSWORD }}

      - name: Get metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: public.cr.cloud.ru/${{ matrix.service.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ./${{ matrix.service.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,oci-mediatypes=false
